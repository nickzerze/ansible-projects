- name: Copy docker-compose-full.yaml to the ec2-instance as docker-compose.yaml
  copy:
    # Από τη στιγμή που τα paths τα έχω με absolute path, δεν 
    src: docker-compose.yaml
    dest: /home/nzerze_aws/docker-compose.yaml
- name: Docker login
  docker_login:
    registry_url: "{{ docker_registry }}"
    username: "{{ docker_username }}"
    # Βλέπουμε ότι εδώ χρησιμοποιούμε το docker_password το οποίο έχουμε ορίσει στο αρχείο project-vars. Δεν
    #   να ορίσουμε και εδώ το vars_files: - project-vars γιατί το έχουμε ήδη ορίσει το επίπεδο του play το οποίο υπάρχει 
    #   στο playbook deploy-docker-with-roles.yaml.
    password: "{{ docker_username }}"
- name: Start containers from with docker compose
  community.docker.docker_compose_v2:
    project_src: /home/nzerze_aws
    # state: present για να τρέξει (up) τα containers, 
    # state: absent για να τα σταματήσει (down) και να τα διαγράψει. 
    #By default είναι το present, οπότε δεν είναι απαραίτητο να το γράψω.
    state: present